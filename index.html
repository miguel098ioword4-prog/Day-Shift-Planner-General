<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day Shift Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Day Shift Planner</h1>
    <p>Organize seus turnos e planeje seu dia.</p>

    <form id="shift-form">
      <label for="shift-name">Nome do turno</label>
      <input id="shift-name" type="text"
             placeholder="Ex.: Turno da manhã" required>

      <label for="shift-time">Horário</label>
      <input id="shift-time" type="time" required>

      <button type="submit">Adicionar turno</button>
    </form>

    <h2>Meus turnos</h2>
    <ul id="shift-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
